[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardlang"
version = "0.0.1"
description = "Parser and static checker for the Card Game DSL"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    # Exact pin, not a floor: with no `[tool.ruff]` config the enabled rule set
    # IS the version's default, so a range would silently change what the lint
    # means from one install to the next.
    "ruff==0.16.0",
]
# The OpenSpiel adapter (cardlang/openspiel). Kept out of `dev` so a local
# core install stays light; the adapter tests skip when pyspiel is absent.
# CI installs `.[dev,openspiel]` and fails if pyspiel doesn't import, so the
# readiness proofs (tests/openspiel_ready/) run on every push — never skip.
openspiel = [
    "open_spiel>=1.6",
]

[project.scripts]
cardlang = "cardlang.cli:main"

[tool.setuptools.packages.find]
include = ["cardlang*"]

[tool.setuptools.package-data]
cardlang = ["grammar/*.lark", "stdlib/*.cardlang"]

[tool.ruff.lint]
# The default rule set of the pinned version, minus three rules that are wrong
# for a codebase under `mypy --strict`. Each was verified by applying the fix
# and reading the resulting mypy errors, not by taste:
#   B009  `getattr(x, "const")` is this repo's deliberate escape from a check
#         mypy would fail — `__dataclass_params__` on a `DataclassInstance`,
#         and module-private names under `no_implicit_reexport`. Rewriting it
#         to `x.const` reproduces the error the escape exists to avoid.
#   B010  same, for `setattr` used to monkeypatch a module attribute whose
#         replacement is deliberately typed loosely.
#   PLC0414 `import X as X` IS the explicit re-export `no_implicit_reexport`
#         demands; dropping the alias breaks every importer.
#   TRY004 asks for a `TypeError` on an `isinstance` refusal. This repo runs a
#         two-currency doctrine — `RuntimeError` for anything a game
#         description can cause, `AssertionError` for a compiler bug — and
#         tests/test_assert_triage.py is the gate that enforces it. All 13
#         sites already raise one of those two, so the rule asks for a third
#         currency the repo's own wall forbids.
#   PLC0206 wants `.items()` where a loop iterates keys and indexes the dict.
#         Every site either uses the key to build a value (`Card(tr, s)`) or
#         indexes a SECOND dict by the same key, so `.items()` removes at most
#         one lookup of two and costs a loop variable. No correctness content.
# Nothing else is silenced repo-wide: the rest of the version's defaults are
# in force, and the handful of deliberate one-off sites carry a `noqa` naming
# the reason (RUF100 fails the lint if one of those ever stops applying).
ignore = ["B009", "B010", "PLC0206", "PLC0414", "TRY004"]

[tool.ruff.lint.per-file-ignores]
# B023 fires on the tracer idiom the playout suite is built from: a per-seed
# accumulator list, a closure over it, and `play_game(game, rng, tracer)` on
# the next line. The closure never outlives its iteration, so the late-binding
# bug B023 exists to catch cannot occur — 62 sites across 18 files, swept by
# AST (every load of the closure name is an argument of a call inside the same
# loop) before this line was written. Production code keeps the rule: nothing
# under `cardlang/` trips it today, and a closure stored there would be real.
# NOTE: that sweep was a one-time check, not a standing one. Mechanizing it as
# a pin (no closure defined in a loop is stored, returned, or appended) is the
# honest follow-up; until then this ignore rests on a comment.
"tests/*" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A recorded gap is an `xfail`, and an `xfail` that starts passing FAILS the
# build (decisions.md "Closed-domain completeness"): closing a gap must force
# the ledger that records it to be updated in the same change. Without this,
# an unexpected pass is reported and ignored — a check that cannot fail.
# The grid mechanism (surface-totality-audit, Step 1) leans on the same
# default: designed-to-flip cells ride as xfail marks, and a bare mark cannot
# opt out of failing loud when its cell starts passing.
xfail_strict = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["cardlang", "tests"]
# Lark ships partial types; keep the front end itself strict.
[[tool.mypy.overrides]]
module = ["lark.*"]
ignore_missing_imports = true
# pyspiel (open_spiel) ships no type stubs; the adapter subclasses its untyped
# Game/State, so relax the subclassing-Any check for that package only.
[[tool.mypy.overrides]]
module = ["pyspiel", "pyspiel.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["cardlang.openspiel.game"]
disallow_subclassing_any = false
disallow_untyped_defs = false
warn_return_any = false  # pyspiel.PlayerId sentinels are untyped (Any)
