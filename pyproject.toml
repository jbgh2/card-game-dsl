[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardlang"
version = "0.0.1"
description = "Parser and static checker for the Card Game DSL"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
]

[project.scripts]
cardlang = "cardlang.cli:main"

[tool.setuptools.packages.find]
include = ["cardlang*"]

[tool.setuptools.package-data]
cardlang = ["grammar/*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["cardlang", "tests"]
# Lark ships partial types; keep the front end itself strict.
[[tool.mypy.overrides]]
module = ["lark.*"]
ignore_missing_imports = true
