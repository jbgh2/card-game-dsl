[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardlang"
version = "0.0.1"
description = "Parser and static checker for the Card Game DSL"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
]
# The OpenSpiel adapter (cardlang/openspiel). Kept out of `dev` so a local
# core install stays light; the adapter tests skip when pyspiel is absent.
# CI installs `.[dev,openspiel]` and fails if pyspiel doesn't import, so the
# readiness proofs (tests/openspiel_ready/) run on every push — never skip.
openspiel = [
    "open_spiel>=1.6",
]

[project.scripts]
cardlang = "cardlang.cli:main"

[tool.setuptools.packages.find]
include = ["cardlang*"]

[tool.setuptools.package-data]
cardlang = ["grammar/*.lark", "stdlib/*.cardlang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The grid mechanism (surface-totality-audit, Step 1) commits designed-to-flip
# cells as xfail marks; strict-by-default means a bare mark cannot opt out of
# failing loud when its cell starts passing.
xfail_strict = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["cardlang", "tests"]
# Lark ships partial types; keep the front end itself strict.
[[tool.mypy.overrides]]
module = ["lark.*"]
ignore_missing_imports = true
# pyspiel (open_spiel) ships no type stubs; the adapter subclasses its untyped
# Game/State, so relax the subclassing-Any check for that package only.
[[tool.mypy.overrides]]
module = ["pyspiel", "pyspiel.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["cardlang.openspiel.game"]
disallow_subclassing_any = false
disallow_untyped_defs = false
warn_return_any = false  # pyspiel.PlayerId sentinels are untyped (Any)
