name: tmp-hold

# Temporary: holds the pool's runner so the route's silent-probe path can be
# witnessed for issue #278. Removed before the pull request opens.
on:
  push:
    tags: [tmp-hold]

jobs:
  hold:
    runs-on: [self-hosted, cardlang]
    timeout-minutes: 5
    steps:
      - run: sleep 150
