name: ci

on:
  push:
    branches: [main]
  pull_request:

# A fast follow-up push to the same PR (or to main) starts a new run before
# the previous one finishes; cancel the stale one instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,openspiel]"
      - name: CPU diagnostics (temporary — investigating xdist regression)
        run: |
          nproc
          python -c "import os; print('cpu_count', os.cpu_count())"
      # The readiness proofs importorskip pyspiel; a broken install would
      # silently skip them all. Fail loudly instead.
      - name: OpenSpiel importable (the readiness proofs must not skip)
        run: python -c "import pyspiel"
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests (corpus harness + units)
        run: pytest -q -n auto
