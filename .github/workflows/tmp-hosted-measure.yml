name: tmp-hosted-measure

# Temporary: one measurement for issue #278, removed before the pull request
# opens. Runs the gate's three checks on both hosted platforms, at the
# worker count each offers, so the hosted lane's runner is chosen on data.
on:
  push:
    branches: [claude/issue-278]
    paths: [.github/workflows/tmp-hosted-measure.yml]

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,openspiel]"
      - name: OpenSpiel importable
        run: python -c "import pyspiel"
      - name: Cores
        run: python -c "import os; print('cpu_count', os.cpu_count())"
      - name: Type check (mypy --strict)
        run: mypy
      - name: Tests (corpus harness + units)
        run: pytest -q -n auto
      - name: Tests (experiment rigs)
        run: pytest experiments/llm_eval/tests -q
