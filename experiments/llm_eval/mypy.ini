; Strict type checking for this experiment only.
;
; Deliberately NOT merged into the repo's `pyproject.toml` mypy `files` list.
; Doing that would make the language's CI gate depend on `anthropic`, `pyyaml`
; and `matplotlib` being installed — dependencies the front end does not have
; and should not acquire because of an experiment sitting outside it. The bar is
; the same (`--strict`); only the invocation is separate:
;
;     mypy --config-file experiments/llm_eval/mypy.ini experiments/llm_eval
;
; The three ignores below are third-party packages that ship no stubs and no
; `py.typed`. `pyspiel` already carries the same exemption in the repo's own
; config, for the same reason.

[mypy]
python_version = 3.11
strict = True
explicit_package_bases = True
namespace_packages = True
mypy_path = .

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pyspiel.*]
ignore_missing_imports = True

[mypy-open_spiel.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

; The adapter is reached through this experiment's imports, so it is checked
; here too. Its exemptions are copied verbatim from the repo's own
; `pyproject.toml` — this config must not hold `cardlang/` to a DIFFERENT bar
; than the gate that owns it.
[mypy-cardlang.openspiel.game]
disallow_subclassing_any = False
disallow_untyped_defs = False
warn_return_any = False

